stages:
  - test
  - deploy

default:
  image: node:20
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/

test:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline || npm install --cache .npm --prefer-offline
    - npm run build
    - npm test
    - cd engine && npm ci && npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "development"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "Engine"

deploy:
  stage: deploy
  script:
    - npm ci --cache .npm --prefer-offline || npm install --cache .npm --prefer-offline
    - npm run build
    - npm test
    - cd engine && npm ci && npm run build && cd ..
    # Support either FIREBASE_SERVICE_ACCT, FIREBASE_SERVICE_ACCOUNT, or FIREBASE_TOKEN
    - |
      KEY_DATA="${FIREBASE_SERVICE_ACCT:-$FIREBASE_SERVICE_ACCOUNT}"
      if [ -n "$KEY_DATA" ]; then
        if [ -f "$KEY_DATA" ]; then
          export GOOGLE_APPLICATION_CREDENTIALS="$KEY_DATA"
        else
          echo "$KEY_DATA" > /tmp/gcp-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
        fi
      fi
    - npx firebase-tools deploy --only hosting --project genesisrpg-site
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "Engine"
